# Solo Postgres para desarrollo local. La app corre fuera de Docker (node directo).
# ponytail: un solo servicio; añadir la app al compose cuando despleguemos, no antes.
services:
  db:
    image: postgres:17-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5434:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data

volumes:
  crm_pgdata:
