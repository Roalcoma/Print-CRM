<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Rocco CRM — el CRM para negocios que venden por WhatsApp e Instagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172C4A"/>
      <stop offset="1" stop-color="#0E1B2E"/>
    </linearGradient>
    <radialGradient id="fruit" cx="0.38" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#F69008"/>
      <stop offset="1" stop-color="#D96F00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F69008" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F69008" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#F69008" fill-opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect x="760" y="0" width="520" height="400" fill="url(#dots)"/>
  <circle cx="190" cy="190" r="190" fill="url(#glow)"/>

  <!-- Isotipo: la fruta de Rocco -->
  <g transform="translate(92 92)">
    <path d="M86 40 C 88 22, 98 10, 112 2" stroke="#0B1626" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M84 30 C 64 6, 34 6, 22 18 C 40 36, 66 40, 84 30 Z" fill="#1F3B63" stroke="#0B1626" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="90" cy="118" r="84" fill="url(#fruit)" stroke="#0B1626" stroke-width="10"/>
    <path d="M150 128 C 146 160, 120 186, 88 190" stroke="#0B1626" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="60" cy="86" rx="20" ry="12" fill="#FFFFFF" fill-opacity="0.28" transform="rotate(-30 60 86)"/>
  </g>

  <!-- Marca -->
  <text x="300" y="160" font-family="'Bricolage Grotesque','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="100" font-weight="800" letter-spacing="-3" fill="#FFFFFF">rocco<tspan fill="#F69008">.</tspan></text>
  <text font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="600" fill="#F6F4F0">
    <tspan x="304" y="210">El CRM para negocios que venden</tspan>
    <tspan x="304" y="246">por WhatsApp e Instagram</tspan>
  </text>
  <text x="304" y="290" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#9FB0C8">Leads · Bandeja unificada · Automatizaciones · Reservas</text>
  <text x="304" y="340" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#F69008">HECHO POR ÁRBOL ÁUREO</text>

  <!-- Tarjeta de lead -->
  <g filter="url(#shadow)" transform="translate(906 70) rotate(3)">
    <rect width="300" height="128" rx="16" fill="#FFFFFF"/>
    <rect x="18" y="18" width="64" height="20" rx="10" fill="#FFF1DE"/>
    <text x="50" y="32" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#C46A00">NUEVO</text>
    <text x="18" y="66" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#13243D">María José Fernández</text>
    <text x="18" y="96" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#059669">USD 106.000</text>
    <rect x="186" y="80" width="96" height="22" rx="11" fill="#ECFDF5"/>
    <text x="234" y="95" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#047857">Anuncio</text>
    <circle cx="268" cy="34" r="16" fill="#F69008"/>
    <text x="268" y="39" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">VR</text>
  </g>

  <!-- Burbujas de chat -->
  <g filter="url(#shadow)" transform="translate(880 236)">
    <rect width="270" height="54" rx="16" fill="#FFFFFF"/>
    <text x="18" y="33" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#13243D">¡Hola! Quiero más información</text>
  </g>
  <g filter="url(#shadow)" transform="translate(950 306)">
    <rect width="250" height="54" rx="16" fill="#DCF8C6"/>
    <text x="18" y="33" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#13243D">¡Claro! Te envío el video</text>
    <text x="234" y="44" text-anchor="end" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#34B7F1">✓✓</text>
  </g>
  <circle cx="1226" cy="250" r="18" fill="#25D366"/>
  <path d="M1217 258 l3 -9 a 10 10 0 1 1 4 4 z" fill="#FFFFFF"/>
</svg>
